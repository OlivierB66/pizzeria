<!DOCTYPE html>
<html>
<head>
    <title>Pizzeria Famille 🍕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        h1 { text-align: center; color: white; margin-bottom: 30px; font-size: 40px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        
        .panel { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); margin-bottom: 20px; }
        .panel h2 { margin-bottom: 20px; color: #333; font-size: 24px; border-bottom: 3px solid #667eea; padding-bottom: 10px; }

        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; }
        input:focus, select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 8px rgba(102, 126, 234, 0.3); }

        /* Grille d'ingrédients en images */
        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .ingredient-card {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .ingredient-card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .ingredient-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
        }

        .ingredient-card label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
        }

        .ingredient-card input[type="checkbox"] {
            width: auto;
            margin: 0;
            display: none;
        }

        /* État sélectionné */
        .ingredient-card input[type="checkbox"]:checked + label {
            background: rgba(102, 126, 234, 0.9);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .ingredient-card input[type="checkbox"]:checked + label::before {
            content: "✓ ";
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active { transform: translateY(0); }

        .confirmation {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            text-align: center;
            display: none;
            font-weight: bold;
        }

        .confirmation.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍕 Pizzeria Famille</h1>
        
        <div class="panel">
            <h2>Commander ta pizza</h2>
            
            <input id="nom" placeholder="Ton prénom" required>
            
            <select id="base">
                <option>-- Choisis une base --</option>
            </select>
            
            <h3 style="margin-top: 20px; margin-bottom: 10px; color: #333;">Sélectionne tes ingrédients :</h3>
            <div class="ingredients-grid" id="ingredients-list"></div>
            
            <button onclick="commanderPizza()">✓ Valider ma commande</button>
            
            <div class="confirmation" id="confirmation">
                🎉 Pizza commandée avec succès !
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        // Charger config au démarrage
        async function chargerConfig() {
        try {
            const res = await fetch(`${API_BASE}/config`);
            const config = await res.json();
            
            // Remplir les bases
            const baseSelect = document.getElementById('base');
            config.bases.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b;
                opt.textContent = b;
                baseSelect.appendChild(opt);
            });

            // Remplir les ingrédients avec images
            const ingList = document.getElementById('ingredients-list');
            config.ingredients.forEach(ing => {
                const div = document.createElement('div');
                div.className = 'ingredient-card';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = ing.nom;
                checkbox.id = `ing-${ing.id}`;
                
                const img = document.createElement('img');
                img.src = ing.image;
                img.alt = ing.nom;
                img.style.cursor = 'pointer';
                img.onclick = function() {  // ← AJOUTE CECI
                    checkbox.checked = !checkbox.checked;
                };
                img.onerror = function() { this.style.display = 'none'; };
                
                const label = document.createElement('label');
                label.htmlFor = `ing-${ing.id}`;
                label.textContent = ing.nom;
                
                div.appendChild(img);
                div.appendChild(checkbox);
                div.appendChild(label);
                ingList.appendChild(div);
            });
        } catch (e) {
            console.error('Erreur config:', e);
        }
    }

        async function commanderPizza() {
            const nom = document.getElementById('nom').value.trim();
            const base = document.getElementById('base').value;
            const ingredients = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
                .map(cb => cb.value);

            if (!nom || base === '-- Choisis une base --' || ingredients.length === 0) {
                alert('Complète ta commande !');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/commander`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nom, base, ingredients })
                });
                const data = await res.json();

                if (res.ok) {
                    // Afficher confirmation
                    document.getElementById('confirmation').classList.add('show');
                    
                    // Réinitialiser le formulaire
                    document.getElementById('nom').value = '';
                    document.getElementById('base').value = '-- Choisis une base --';
                    document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
                    
                    // Masquer la confirmation après 3s
                    setTimeout(() => {
                        document.getElementById('confirmation').classList.remove('show');
                    }, 3000);
                } else {
                    alert('Erreur: ' + data.erreur);
                }
            } catch (e) {
                alert('Erreur réseau: ' + e.message);
            }
        }

        // Init
        chargerConfig();
    </script>
</body>
</html>
